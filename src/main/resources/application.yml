spring:
  application.name: property-management
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/property_management}
    username: ${DB_USER:property}
    password: ${DB_PASSWORD:property}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson.serialization.write-dates-as-timestamps: false
server:
  port: 8080
  error.include-message: always