<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>body{font:16px Arial;max-width:420px;margin:5rem auto;padding:1rem}input,button{display:block;width:100%;box-sizing:border-box;padding:.8rem;margin:.7rem 0}button{background:#1d5b4a;color:#fff;border:0}</style></head><body><h1>Property Management</h1><form onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="message"></p><script>function login(e){e.preventDefault();localStorage.setItem('auth',btoa(email.value+':'+password.value));location.href='dashboard.html'}</script></body></html>
