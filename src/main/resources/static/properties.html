<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Properties</title></head><body><main><h1>Properties</h1><form onsubmit="add(event)"><input id="name" placeholder="Building name" required><input id="address" placeholder="Address" required><button>Add building</button></form><ul id="list"></ul></main><script>const h={Authorization:'Basic '+localStorage.getItem('auth'),'Content-Type':'application/json'};function load(){fetch('/api/buildings',{headers:h}).then(r=>r.json()).then(a=>list.innerHTML=a.map(x=>'<li>'+x.name+' — '+x.address+'</li>').join(''))}function add(e){e.preventDefault();fetch('/api/buildings',{method:'POST',headers:h,body:JSON.stringify({name:name.value,address:address.value})}).then(load)}load()</script></body></html>
