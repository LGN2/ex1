<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><style>body{font:16px Arial;max-width:900px;margin:3rem auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.card{padding:1.5rem;background:#eef5f1;border-radius:12px}a{color:#1d5b4a}</style></head><body><h1>Dashboard</h1><p><a href="properties.html">Properties</a> · <a href="login.html">Logout</a></p><div id="cards" class="grid"></div><script>fetch('/api/dashboard/summary',{headers:{Authorization:'Basic '+localStorage.getItem('auth')}}).then(r=>r.json()).then(x=>cards.innerHTML=Object.entries(x).map(([k,v])=>'<div class="card"><b>'+k+'</b><h2>'+v+'</h2></div>').join(''))</script></body></html>
